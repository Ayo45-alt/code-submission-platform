<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CodeBench{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .hero-glow {
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.08), transparent);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex font-sans">

    <div class="hero-glow fixed inset-0 pointer-events-none"></div>

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900/80 border-r border-gray-800/50 flex flex-col p-6 fixed h-full z-10">
        
        <!-- Logo -->
        <div class="mb-10 flex items-center gap-2">
            <svg class="w-6 h-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <div>
                <h1 class="text-lg font-bold tracking-tight leading-none">
                    <span class="text-white">Code</span><span class="text-emerald-400">Bench</span>
                </h1>
                <p class="text-xs text-gray-500 mt-0.5">Python Assessment Platform</p>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex flex-col gap-1 flex-1">
            {% block sidebar %}{% endblock %}
        </nav>

        <!-- User info at bottom -->
        <div class="border-t border-gray-800/50 pt-4 mt-4">
            <p class="text-sm font-medium text-white">{{ user.username }}</p>
            <p class="text-xs text-emerald-400 capitalize mt-0.5">{{ user.role }}</p>
            <a href="/accounts/logout/" 
               class="text-xs text-gray-500 hover:text-red-400 mt-3 block transition">
               Logout
            </a>
        </div>

    </aside>

    <!-- Main content -->
    <main class="ml-64 flex-1 p-8 relative">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
