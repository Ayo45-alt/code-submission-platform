{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeBench</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="{% static 'js/tailwind.js' %}"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #F8FAFC;
            font-family: "Plus Jakarta Sans", sans-serif;
            color: #0F172A;
        }

        .glow-blob {
            filter: blur(80px);
            opacity: 0.4;
            mix-blend-mode: multiply;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col relative overflow-x-hidden bg-[#F8FAFC]">

<!-- Ambient Blur Blobs -->
<div class="glow-blob absolute top-[-10%] right-[-10%] w-[350px] h-[350px] rounded-full bg-emerald-100 pointer-events-none z-0"></div>
<div class="glow-blob absolute bottom-[-10%] left-[-10%] w-[350px] h-[350px] rounded-full bg-blue-50 pointer-events-none z-0"></div>

<div class="relative z-10 flex flex-col min-h-screen">
    <!-- NAV -->
    <nav class="flex justify-between items-center max-w-7xl mx-auto w-full px-6 lg:px-8 py-5 border-b border-[#E2E8F0] bg-white/80 backdrop-blur-md">
        <a href="/" class="flex items-center gap-2 select-none group">
            <svg class="h-8 w-auto transform group-hover:scale-[1.02] transition-transform duration-200" viewBox="8 8 46 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Green open brace { -->
                <path d="M18 10C14 10 13 12 13 15V18C13 20 11 20 10 20C11 20 13 20 13 22V25C13 28 14 30 18 30" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- C Container -->
                <path d="M35 14H28C26.8954 14 26 14.8954 26 16V24C26 25.1046 26.8954 26 28 26H35" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
                <!-- Green Checkmark inside C -->
                <path d="M29 20L31 22L34 17" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Green close brace } -->
                <path d="M43 10C47 10 48 12 48 15V18C48 20 50 20 51 20C50 20 48 20 48 22V25C48 28 47 30 43 30" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="font-bold text-lg text-slate-900 hidden sm:block">CodeBench</span>
        </a>

        <a href="/accounts/register/" class="text-sm font-semibold text-slate-600 hover:text-slate-900 transition-colors">
            Create account
        </a>
    </nav>

    <!-- LOGIN CARD -->
    <div class="flex-1 flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-md space-y-8">
            <!-- Header -->
            <div class="text-center">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome back</h1>
                <p class="text-slate-500 text-sm mt-2 font-medium">
                    Log in to continue to CodeBench
                </p>
            </div>

            <!-- Card -->
            <div class="bg-white border border-[#E2E8F0] rounded-2xl p-8 shadow-xl shadow-slate-100/50 backdrop-blur-sm">
                {% if messages %}
                <div class="mb-5 bg-red-50 border border-red-100 rounded-xl p-4 flex items-center gap-3">
                    <svg class="w-5 h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                    <div>
                        {% for message in messages %}
                        <p class="text-red-700 text-xs font-semibold">{{ message }}</p>
                        {% endfor %}
                    </div>
                </div>
                {% endif %}

                <form method="POST" action="/accounts/login/" class="space-y-5">
                    {% csrf_token %}

                    <!-- Username -->
                    <div>
                        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Username</label>
                        <input type="text" name="username" required
                            class="w-full mt-2 px-4 py-3.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm
                            focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:bg-white transition-all duration-200"
                            placeholder="Enter your username">
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
                        <input type="password" name="password" required
                            class="w-full mt-2 px-4 py-3.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm
                            focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:bg-white transition-all duration-200"
                            placeholder="Enter your password">
                    </div>

                    <!-- Button -->
                    <button type="submit"
                        class="w-full bg-[#10B981] hover:bg-[#059669] text-white font-semibold py-3.5 rounded-xl transition-all duration-200 shadow-md shadow-emerald-500/10 mt-6 flex items-center justify-center gap-2">
                        Log In
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <p class="text-center text-slate-400 text-[11px] font-semibold tracking-wide uppercase select-none">
                CodeBench — Caleb University · Computer Science
            </p>
        </div>
    </div>
</div>

</body>
</html>
