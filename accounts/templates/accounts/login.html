<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeBench</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .hero-glow {
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.15), transparent);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">

    <div class="hero-glow fixed inset-0 pointer-events-none"></div>

    <!-- Navbar -->
    <nav class="relative border-b border-gray-800/50 px-8 py-4 flex justify-between items-center">
        <a href="/" class="flex items-center gap-2">
            <svg class="w-7 h-7 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <h1 class="text-lg font-bold tracking-tight">
                <span class="text-white">Code</span><span class="text-emerald-400">Bench</span>
            </h1>
        </a>
        <a href="/accounts/register/" class="text-sm text-gray-400 hover:text-white transition">
            Don't have an account? Register
        </a>
    </nav>

    <!-- Login form -->
    <div class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-white">Welcome back</h2>
                <p class="text-gray-400 mt-2 text-sm">Login to your CodeBench account</p>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">

                {% if messages %}
                <div class="bg-red-900/30 border border-red-800 rounded-lg p-4 mb-6">
                    {% for message in messages %}
                    <p class="text-red-400 text-sm font-medium">{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}

                <form method="POST" action="/accounts/login/">
                    {% csrf_token %}

                    <!-- Username -->
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                        <input type="text" name="username" required
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition"
                            placeholder="Enter your username">
                    </div>

                    <!-- Password -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                        <input type="password" name="password" required
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition"
                            placeholder="Enter your password">
                    </div>

                    <button type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-lg font-semibold text-sm transition">
                        Login
                    </button>
                </form>
            </div>

            <p class="text-center text-gray-600 text-xs mt-6">
                CodeBench — Caleb University, Department of Computer Science
            </p>
        </div>
    </div>

</body>
</html>
